name: Build LSK Academy Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Generate Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build LSK Mobile Web App
        run: |
          echo "Building Vite web bundle for LSK Academy Mobile..."
          cd packages/mobile-app
          npm install --legacy-peer-deps
          npm run build
          ls -la dist/

      - name: Setup Capacitor Android Platform
        run: |
          cd packages/mobile-app
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save
          npx cap add android || true
          npx cap sync android

      - name: Configure Android SDK Location
        run: |
          cd packages/mobile-app/android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android Debug APK with Gradle
        run: |
          cd packages/mobile-app/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect Built APK
        run: |
          mkdir -p output-apk
          find packages/mobile-app/android -name "*.apk" -exec cp {} output-apk/LSK-Academy-Mobile.apk \;
          echo "Listing compiled APK:"
          ls -lh output-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LSK-Academy-Android-APK
          path: output-apk/LSK-Academy-Mobile.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: output-apk/LSK-Academy-Mobile.apk
          name: LSK Academy Mobile App v1.0
          tag_name: v1.0.0
          draft: false
          prerelease: false
