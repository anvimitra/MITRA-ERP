name: Build MITRA-ERP Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Generate Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build MITRA-ERP Mobile Web App
        run: |
          echo "Building Vite web bundle for MITRA-ERP Mobile..."
          cd packages/mobile-app
          npm install --legacy-peer-deps
          npm run build
          ls -la dist/

      - name: Setup Standalone Capacitor Android
        run: |
          echo "Setting up isolated Android build environment..."
          BUILD_DIR="${RUNNER_TEMP}/mobile-apk-build"
          mkdir -p "$BUILD_DIR"
          
          # Copy built web assets and capacitor config
          cp -r packages/mobile-app/dist "$BUILD_DIR/dist"
          cp packages/mobile-app/capacitor.config.json "$BUILD_DIR/"

          cd "$BUILD_DIR"
          cat << 'EOF' > package.json
          {
            "name": "mitra-erp-mobile",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.2.0",
              "@capacitor/android": "^6.2.0",
              "@capacitor/local-notifications": "^6.0.0",
              "@capacitor/geolocation": "^6.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.2.0"
            }
          }
          EOF

          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

          # Copy custom Java source files (MainActivity, AppUpdateInstallerPlugin, etc.)
          if [ -d "$GITHUB_WORKSPACE/packages/mobile-app/android/app/src/main/java" ]; then
            cp -r "$GITHUB_WORKSPACE/packages/mobile-app/android/app/src/main/java/"* "$BUILD_DIR/android/app/src/main/java/" || true
          fi

          # Copy custom app icons/res from repo if available
          if [ -d "$GITHUB_WORKSPACE/packages/mobile-app/android/app/src/main/res" ]; then
            cp -r "$GITHUB_WORKSPACE/packages/mobile-app/android/app/src/main/res/"* "$BUILD_DIR/android/app/src/main/res/" || true
          fi

          # Copy persistent signing keystore
          mkdir -p "$BUILD_DIR/android/keystore"
          if [ -d "$GITHUB_WORKSPACE/packages/mobile-app/android/keystore" ]; then
            cp -r "$GITHUB_WORKSPACE/packages/mobile-app/android/keystore/"* "$BUILD_DIR/android/keystore/" || true
          fi

          # Copy customized app build.gradle with permanent signingConfig
          if [ -f "$GITHUB_WORKSPACE/packages/mobile-app/android/app/build.gradle" ]; then
            cp "$GITHUB_WORKSPACE/packages/mobile-app/android/app/build.gradle" "$BUILD_DIR/android/app/build.gradle"
          fi

          # Inject real Android OS permissions into AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          node -e "
            const fs = require('fs');
            const file = '$MANIFEST';
            let content = fs.readFileSync(file, 'utf8');
            const perms = [
              '    <uses-permission android:name=\"android.permission.INTERNET\" />',
              '    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />',
              '    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />',
              '    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />',
              '    <uses-feature android:name=\"android.hardware.location.gps\" android:required=\"false\" />',
              '    <uses-permission android:name=\"android.permission.VIBRATE\" />',
              '    <uses-permission android:name=\"android.permission.WAKE_LOCK\" />',
              '    <uses-permission android:name=\"android.permission.REQUEST_INSTALL_PACKAGES\" />'
            ].join('\n');
            content = content.replace(/<uses-permission android:name=\"android\.permission\.INTERNET\"\s*\/>/, perms);
            fs.writeFileSync(file, content, 'utf8');
          "
          echo "=========================================="
          echo "VERIFIED INJECTED ANDROID PERMISSIONS:"
          grep "uses-permission" "$MANIFEST"
          echo "=========================================="

          # Configure Android SDK location for Gradle
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties

      - name: Verify Signing Keystore with Java 17 Keytool
        run: |
          BUILD_DIR="${RUNNER_TEMP}/mobile-apk-build"
          KEYSTORE_FILE="$BUILD_DIR/android/keystore/mitra-release.keystore"
          mkdir -p "$BUILD_DIR/android/keystore"
          
          if [ -f "$KEYSTORE_FILE" ]; then
            echo "Verifying existing keystore..."
            keytool -list -v -keystore "$KEYSTORE_FILE" -storepass mitraErp2026 || {
              echo "Re-generating clean keystore using Java 17 keytool..."
              rm -f "$KEYSTORE_FILE"
              keytool -genkeypair -v \
                -keystore "$KEYSTORE_FILE" \
                -alias mitra_erp \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass mitraErp2026 \
                -keypass mitraErp2026 \
                -dname "CN=MITRA-ERP, OU=Mobile, O=Anvimitra, L=Jaipur, ST=Rajasthan, C=IN"
            }
          else
            echo "Generating new permanent keystore..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias mitra_erp \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass mitraErp2026 \
              -keypass mitraErp2026 \
              -dname "CN=MITRA-ERP, OU=Mobile, O=Anvimitra, L=Jaipur, ST=Rajasthan, C=IN"
          fi
          
          # Print keystore certificate details
          keytool -list -v -keystore "$KEYSTORE_FILE" -storepass mitraErp2026
          
          # Sync back to workspace
          mkdir -p "$GITHUB_WORKSPACE/packages/mobile-app/android/keystore"
          cp "$KEYSTORE_FILE" "$GITHUB_WORKSPACE/packages/mobile-app/android/keystore/mitra-release.keystore"

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android Signed APK with Gradle
        run: |
          BUILD_DIR="${RUNNER_TEMP}/mobile-apk-build"
          cd "$BUILD_DIR/android"
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect and Verify Built APK
        run: |
          BUILD_DIR="${RUNNER_TEMP}/mobile-apk-build"
          mkdir -p output-apk
          # Prefer release APK if signed, otherwise debug APK (both signed with identical mitra-release.keystore)
          RELEASE_APK=$(find "$BUILD_DIR/android" -name "*release*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "Using signed release APK: $RELEASE_APK"
            cp "$RELEASE_APK" output-apk/MITRA-ERP.apk
          else
            DEBUG_APK=$(find "$BUILD_DIR/android" -name "*.apk" | head -n 1)
            echo "Using signed debug APK: $DEBUG_APK"
            cp "$DEBUG_APK" output-apk/MITRA-ERP.apk
          fi
          echo "=========================================="
          echo "SUCCESSFULLY GENERATED ANDROID APK:"
          ls -lh output-apk/MITRA-ERP.apk
          echo "=========================================="

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MITRA-ERP-Android-APK
          path: output-apk/MITRA-ERP.apk
          retention-days: 30

      - name: Generate Release Manifest (version.json)
        run: |
          mkdir -p output-apk
          DATE_NOW=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          cat << EOF > output-apk/version.json
          {
            "appName": "MITRA-ERP Mobile",
            "version": "1.2.1",
            "versionCode": 103,
            "publishedAt": "${DATE_NOW}",
            "assetUpdatedAt": "${DATE_NOW}",
            "latestApkUrl": "https://github.com/anvimitra/MITRA-ERP/releases/download/latest/MITRA-ERP.apk",
            "latestIpaUrl": "https://github.com/anvimitra/MITRA-ERP/releases/download/latest/MITRA-ERP-iOS.ipa",
            "releaseNotes": "Official MITRA-ERP release with latest features, real-time push synchronization and speed improvements.",
            "autoUpdateSupported": true
          }
          EOF
          cat output-apk/version.json

      - name: Publish or Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          files: |
            output-apk/MITRA-ERP.apk
            output-apk/version.json
          name: MITRA-ERP Mobile App (Latest Release)
          tag_name: latest
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Locked Release Keystore if Changed
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/mobile-app/android/keystore/mitra-release.keystore
          git diff --staged --quiet || (git commit -m "chore(android): lock permanent Java 17 release keystore [skip ci]" && git push)
