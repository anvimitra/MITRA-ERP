name: Build LSK Academy Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Generate Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build LSK Mobile Web App
        run: |
          echo "Building Vite web bundle for LSK Academy Mobile..."
          cd packages/mobile-app
          npm install --legacy-peer-deps
          npm run build
          ls -la dist/

      - name: Setup Standalone Capacitor Android
        run: |
          echo "Setting up isolated Android build environment..."
          BUILD_DIR="${RUNNER_TEMP}/mobile-apk-build"
          mkdir -p "$BUILD_DIR"
          
          # Copy built web assets and capacitor config
          cp -r packages/mobile-app/dist "$BUILD_DIR/dist"
          cp packages/mobile-app/capacitor.config.json "$BUILD_DIR/"

          cd "$BUILD_DIR"
          cat << 'EOF' > package.json
          {
            "name": "lsk-academy-mobile",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.2.0",
              "@capacitor/android": "^6.2.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.2.0"
            }
          }
          EOF

          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

          # Configure Android SDK location for Gradle
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android Debug APK with Gradle
        run: |
          BUILD_DIR="${RUNNER_TEMP}/mobile-apk-build"
          cd "$BUILD_DIR/android"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect and Verify Built APK
        run: |
          BUILD_DIR="${RUNNER_TEMP}/mobile-apk-build"
          mkdir -p output-apk
          find "$BUILD_DIR/android" -name "*.apk" -exec cp {} output-apk/LSK-Academy-Mobile.apk \;
          echo "=========================================="
          echo "SUCCESSFULLY GENERATED ANDROID APK:"
          ls -lh output-apk/LSK-Academy-Mobile.apk
          echo "=========================================="

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LSK-Academy-Android-APK
          path: output-apk/LSK-Academy-Mobile.apk
          retention-days: 30

      - name: Publish or Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: output-apk/LSK-Academy-Mobile.apk
          name: LSK Academy Mobile App (Auto-Updated Latest Release)
          tag_name: latest
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
